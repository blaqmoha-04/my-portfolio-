<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <meta id="meta-description" name="description">
  <title>myPortfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="config/api.config.js"></script>
  <script defer src="js/data/portfolio.js"></script>
  <script defer src="js/services/api.js"></script>
  <script defer src="js/app.js"></script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>
  <a class="profile-transition" href="#home" aria-label="Home">
    <img class="profile-transition-image" alt="" width="160" height="160">
    <span class="profile-orbit profile-orbit-one" aria-hidden="true"></span>
    <span class="profile-orbit profile-orbit-two" aria-hidden="true"></span>
  </a>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand-group">
        <a class="wordmark nav-brand-mark" href="#home" aria-label="BLAQMOHA, home">
          <span id="nav-logo-text">BM</span>
        </a>
        <span class="nav-profile-slot" aria-hidden="true"></span>
      </div>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <span></span><span class="sr-only">Toggle navigation</span>
      </button>
      <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
        <a href="#work" data-nav-label="work"></a>
        <a href="#about" data-nav-label="about"></a>
        <a href="#skills" data-nav-label="skills"></a>
        <a class="nav-contact" href="#contact"><span id="nav-contact-label"></span> <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero page-shell" id="home" aria-labelledby="hero-title">
      <div class="profile-stage" aria-hidden="true"></div>
      <div class="hero-copy">
        <p class="eyebrow"><span class="status-dot"></span> <span id="hero-eyebrow"></span></p>
        <h1 id="hero-title"></h1>
        <p class="hero-headline" id="hero-headline"></p>
        <div class="hero-bottom">
          <p class="hero-intro" id="hero-intro"></p>
          <div class="hero-actions">
            <a class="hero-action" href="#work"><span id="hero-work-action"></span> <span aria-hidden="true">↓</span></a>
            <a class="hero-action hero-action-secondary" href="#contact"><span id="hero-contact-action"></span> <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </div>
      <span class="hero-index">Portfolio / <span id="portfolio-year"></span></span>
    </section>

    <div class="ticker" id="ticker" aria-label="">
      <div class="ticker-track" aria-hidden="true"></div>
    </div>

    <section class="work-section section-shell" id="work" aria-labelledby="work-title">
      <div class="section-heading">
        <div class="reveal">
          <p class="eyebrow" id="work-eyebrow"></p>
          <h2 id="work-title"></h2>
        </div>
        <p class="section-note" id="work-note"></p>
      </div>
      <div class="filters" role="group" aria-label="Filter projects">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true"></button>
        <button class="filter-button" type="button" data-filter="graphic-design" aria-pressed="false"></button>
        <button class="filter-button" type="button" data-filter="software-development" aria-pressed="false"></button>
      </div>
      <div class="project-grid" id="project-grid" aria-live="polite" aria-busy="true"></div>
      <p class="portfolio-status" id="portfolio-status" role="status" aria-live="polite" hidden></p>
    </section>

    <section class="about-section section-shell" id="about" aria-labelledby="about-title">
      <div class="section-heading reveal">
        <div>
          <p class="eyebrow" id="about-eyebrow"></p>
          <h2 id="about-title"></h2>
        </div>
        <div class="about-copy">
          <p id="about-copy"></p>
          <p class="about-aside" id="about-aside"></p>
        </div>
      </div>
      <div class="values-row reveal" id="values-row" aria-label=""></div>
    </section>

    <section class="skills-section section-shell" id="skills" aria-labelledby="skills-title">
      <div class="section-heading reveal">
        <div>
          <p class="eyebrow" id="skills-eyebrow"></p>
          <h2 id="skills-title"></h2>
        </div>
        <p class="section-note" id="skills-note"></p>
      </div>
      <div class="skill-groups" id="skill-groups"></div>
    </section>

    <section class="contact-section" id="contact" aria-labelledby="contact-title">
      <div class="contact-inner section-shell">
        <p class="eyebrow" id="contact-eyebrow"></p>
        <h2 class="reveal" id="contact-title"></h2>
        <p class="contact-intro reveal" id="contact-intro"></p>
        <form class="contact-form" id="contact-form">
          <label>
            <span id="contact-name-label"></span>
            <input name="name" autocomplete="name" required maxlength="120">
          </label>
          <label>
            <span id="contact-email-label"></span>
            <input name="email" type="email" autocomplete="email" required maxlength="254">
          </label>
          <label class="message-field">
            <span id="contact-message-label"></span>
            <textarea name="message" rows="3" required maxlength="5000"></textarea>
          </label>
          <button class="send-button" type="submit"><span id="contact-submit-label"></span> <span aria-hidden="true">↗</span></button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
        <p class="email-note"><span id="direct-email-label"></span> <a id="email-link"></a></p>
        <nav class="social-links" id="social-links" aria-label="Social links" hidden></nav>
      </div>
      <div class="contact-decoration" id="contact-decoration" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="wordmark footer-mark" href="#home" aria-label="Back to top"><span id="footer-logo-text"></span><span>.</span></a>
    <p id="footer-tagline"></p>
    <p>© <span id="current-year"></span> <span id="footer-name"></span>. <span id="footer-rights"></span></p>
  </footer>
</body>

</html>
